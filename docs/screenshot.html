</style><body><div class="card"><div class="brand">篝火出品</div><h1>视频出海翻译配音</h1><p class="desc">把视频做成字幕翻译加配音：语音识别、字幕切分与翻译、双语字幕压进视频，并可选生成配音。</p><h2>怎么用</h2><ol><li><span>下载 portable.zip 解压，双击启动脚本；第一次启动自动安装依赖和 FFmpeg</span></li><li><span>完成后自动打开 http://localhost:8501</span></li><li><span>在左侧栏填大模型接口、识别语言、目标语言，上传视频或粘贴 YouTube 链接</span></li><li><span>依次执行识别、翻译、字幕生成，需要配音时再选配音方式；结果在 output/ 目录</span></li></ol><div class="fmt"><b>交付形式　</b>启动器 portable.zip，在浏览器里操作</div></div></body></html>
